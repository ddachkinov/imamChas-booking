version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: booking-postgres-dev
    environment:
      POSTGRES_DB: booking_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking-redis-dev
    command: redis-server --requirepass devredispass
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: booking-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:devpassword123@postgres:5432/booking_dev
      REDIS_URL: redis://:devredispass@redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      REFRESH_TOKEN_SECRET: dev-refresh-secret-key
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking-network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: booking-frontend-dev
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - booking-network
    command: npm run dev -- --host

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: booking-adminer
    ports:
      - "8080:8080"
    networks:
      - booking-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

networks:
  booking-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  backend_logs:
